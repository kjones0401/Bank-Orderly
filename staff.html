{% extends 'base.html' %}{% block content %}<form method="post" class="panel">{{ security() }}<h2>Create a staff login</h2><div class="form-grid"><label>Username<input name="username" maxlength="80" required autocomplete="off"></label><label>Password<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>Role<select name="role"><option>Teller</option><option>Admin</option></select></label></div><p class="hint">Tellers can manage customer accounts and financial transactions. Admins also manage staff, audit reports, and restricted reviews.</p><button type="submit">Create staff account</button></form><section class="panel"><h2>Staff directory</h2>{{ table(rows) }}</section>{% endblock %}
