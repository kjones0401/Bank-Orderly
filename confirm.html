{% extends 'base.html' %}{% block content %}<section class="panel narrow"><div class="notice warning">{{ message }}<br>This action requires explicit confirmation.</div><form method="post">{{ security() }}{% for key,value in values.items() %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}<input type="hidden" name="confirm_overdraft" value="yes"><div class="actions"><button class="danger" type="submit">Confirm negative balance</button><a href="{{ url_for('search') }}">Cancel without posting</a></div></form></section>{% endblock %}
