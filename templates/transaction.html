{% extends 'base.html' %}{% block content %}<form method="post" class="panel narrow">{{ security() }}<label>Account number<input name="account_number" value="{{ number }}" inputmode="numeric" required></label><label>{{ title }} amount ($)<input name="amount" inputmode="decimal" placeholder="25.00" required></label><label>Payment method<select name="method"><option>Cash</option><option>Electronic</option></select></label><label>Cash conductor customer ID (optional)<input name="conductor"><small>Blank means the account owner. Other conductors must be verified customers.</small></label><div class="actions"><button type="submit">Complete {{ title|lower }}</button><a href="{{ url_for('search') }}">Cancel</a></div></form>{% endblock %}
