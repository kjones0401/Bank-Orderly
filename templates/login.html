{% extends 'base.html' %}{% block content %}<section class="panel auth"><div class="auth-mark">BO</div><p>{{ 'Set up the first staff login for this database.' if setup else 'Sign in with your individual teller or admin account.' }}</p>
<form method="post">{{ security() }}<label>Username<input name="username" maxlength="80" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="{{ 'new-password' if setup else 'current-password' }}" {% if setup %}minlength="12"{% endif %} required></label>{% if setup %}<p class="hint">The first account is an Admin. Choose at least 12 characters.</p>{% endif %}<button type="submit">{{ 'Create Admin' if setup else 'Sign in' }}</button></form></section>{% endblock %}
